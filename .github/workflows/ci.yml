name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The webhook lab's admin secret, the ledger's post secret, the watch's
  # admin secret (examples/) and the admin UI's secret (apps/admin), which
  # `minicloud check` resolves.
  WEBHOOKS_ADMIN_TOKEN: ci
  LEDGER_TOKEN: ci
  WATCH_ADMIN_TOKEN: ci
  ADMIN_UI_TOKEN: ci

jobs:
  test:
    # x86-64 Linux, so the native tier is built and exercised.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      # Everything under `--profile checked` (release with debug assertions
      # and overflow checks): the tests run Cove programs, which unoptimised
      # is several times slower, and one profile means one build.
      - name: clippy
        run: cargo clippy --workspace --all-targets --profile checked -- -D warnings
      - name: doc
        run: cargo doc --workspace --no-deps --profile checked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: test
        run: cargo test --workspace --profile checked
      - name: test on the encoded VM
        run: cargo test --profile checked --tests
        env:
          COVE_HOST_TEST_BACKEND: vm
      - name: check and test the bundled app and the examples
        run: |
          ./target/checked/minicloud check --apps apps
          ./target/checked/minicloud test --apps apps
          ./target/checked/minicloud check --apps examples
          ./target/checked/minicloud test --apps examples
      # cove#604's reproduction: 160 sliced native runs that copy arrays
      # into vectors, every answer 60000. Wrong answers at Cove 9272282.
      - name: native copy-under-slicing regression check
        run: sh bench/repro/run.sh native
      - name: lint the deploy scripts
        run: shellcheck deploy/*.sh
      # The release tarball, built from this binary, installed into a
      # scratch home and run with the systemd unit's own command line.
      - name: package, install and run as deployed
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tarball="$(deploy/package.sh "$version" target/checked/minicloud "$RUNNER_TEMP/dist")"
          deploy/smoke.sh "$tarball"
