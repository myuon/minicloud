# The webhook lab (issue #2): receive URLs that keep every request sent to
# them, and admin pages to read them. Everything is stored in the app's own
# key-value store, so it survives a restart.
grant = ["kv", "log", "time", "random", "auth", "fetch", "timer"]

[limits]
deadline = "10s"
# A webhook body; an endpoint stores at most its own `maxBody` of it.
max_request_bytes = 1048576
max_response_bytes = 4194304

[kv]
# An event is its body (at most 1 MiB) and its headers, as JSON.
max_value_bytes = 4194304
max_keys = 1000000
max_bytes = 1073741824

# Where a stored request may be resent: this host's own receive URLs, as
# the walkthrough serves them (port 8080), as `deploy/` serves them (port
# 8790), and at the deployment's public origin, whose `/webhooks/in/` the
# Cloudflare Access setup leaves open (`deploy/cloudflare.md`). Add the
# services you resend to.
[fetch]
allow = [
  "http://127.0.0.1:8080",
  "http://localhost:8080",
  "http://127.0.0.1:8790",
  "http://localhost:8790",
  "https://covtools.ramda.io",
]
# Below the run's deadline, so that a slow target is a stored failure rather
# than a 504.
timeout = "8s"
max_response_bytes = 1048576

# Who may use the admin pages (`auth.identity`; the receive URLs need
# nobody). Deployed, the user Cloudflare Access let in, verified by the host
# against the team's keys and the `covtools` Access application (`aud`).
# The values are the deployment's, from the environment
# (deploy/env.example); with `team` or `aud` unset — a local run — Access is
# off and the `admin` secret is the way in, as `Authorization: Bearer
# <secret>` or the password of a browser's login prompt. With Access on,
# `fallback = "none"`: the secret is not accepted.
[access]
team = { env = "ACCESS_TEAM_DOMAIN" }
aud = { env = "COVTOOLS_ACCESS_AUD" }
emails = { env = "ACCESS_ALLOWED_EMAILS" }
token = "admin"
fallback = "none"

# The token way in, for a run without Access. Set it in the environment the
# host runs in; the app is refused at load without it.
[secrets]
admin = { env = "WEBHOOKS_ADMIN_TOKEN" }

# `assets/` beside this file is served by the host itself, before any
# request reaches the app — and before the `[access]` above: the admin pages'
# stylesheet and script, which are public anyway. As files, the pages need
# nothing inline and the CSP can say `style-src 'self'; script-src 'self'`.
# A GET or HEAD for `/webhooks/app.js` is `assets/app.js`. The host's
# defaults for it (8 MiB in all, `cache-control: no-cache`) are right for
# two small files, so there is no `[assets]` section here.
