# The algorithm playground (issue #4): maximum bipartite matching — and, in
# later PRs, SAT and simulated annealing — written in Cove, run on request.
# Pure but for the clock, which times each run.
grant = ["time"]

[limits]
# What bounds a run's work: far above any example but the heavy ones,
# on the VM too, and what stops those.
deadline = "10s"
max_host_calls = 64
# The runtime's default, 32 MiB: the matching page's largest graph, 30000
# vertices a side and 300000 edges, needs more than half of it.
max_heap_words = 4194304
max_in_flight = 4
max_queued = 32
max_request_bytes = 262144
max_response_bytes = 4194304

# `assets/` beside this file is served by the host itself, before any
# request reaches the app: the page's stylesheet and its script, as files,
# so that the pages need nothing inline and the CSP can say `style-src
# 'self'; script-src 'self'`. A GET or HEAD for `/algo/app.js` is
# `assets/app.js`. The host's defaults for it (8 MiB in all,
# `cache-control: no-cache`) are right for two small files, so there is no
# `[assets]` section here.
