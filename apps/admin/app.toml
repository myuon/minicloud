# The admin app (issue #17): what the host runs, and the forms that change
# it — enable or disable an app, its grant, its fetch allowlist, its limits.
# It is the one app that may be granted `admin`, and it reaches the host
# only through the `host` module that capability opens.
grant = ["admin", "auth"]

# A change reloads the app it is about — check, prepare, compile — while
# the request that asked for it is parked; a large app takes a while.
[limits]
deadline = "60s"

# Reached only by these hostnames, never as /admin/ on another:
# `covtools-admin.ramda.io` is the deployment's, behind its own Cloudflare
# Access application (deploy/cloudflare.md); `admin.localhost` is for a
# browser on the machine itself (`*.localhost` is loopback).
[route]
hosts = ["covtools-admin.ramda.io", "admin.localhost"]

# Who may use the pages (`auth.identity`). Deployed, the user Cloudflare
# Access let in: the host verifies the `Cf-Access-Jwt-Assertion` token
# against the team's keys and this app's Access application (`aud`), and the
# change history records its email. The values are the deployment's, from
# the environment (deploy/env.example); with `team` or `aud` unset — a local
# run — Access is off and the `admin` secret is the way in, as
# `Authorization: Bearer <secret>` or the password of the browser's login
# prompt. With Access on, `fallback = "none"`: the secret is not accepted,
# so a request that did not come through Access (straight to the host's
# port) is refused whatever it presents.
[access]
team = { env = "ACCESS_TEAM_DOMAIN" }
aud = { env = "COVTOOLS_ADMIN_ACCESS_AUD" }
emails = { env = "ACCESS_ALLOWED_EMAILS" }
token = "admin"
fallback = "none"

# The token way in, for a run without Access. The app is refused at load
# without it.
[secrets]
admin = { env = "ADMIN_UI_TOKEN" }

# `assets/` beside this file is served by the host itself, before any
# request reaches the app: the stylesheet and the icons, as files, so that
# the pages need no inline style and the CSP can say `style-src 'self'`. A
# GET or HEAD for `/style.css` is `assets/style.css`. The host's defaults
# for it (8 MiB in all, `cache-control: no-cache`) are right for a few small
# files, so there is no `[assets]` section here.
#
# The pages ask for these files as `/style.css?v=<version>`, so a deploy
# changes the URL and nothing of an old one can be held against new HTML.
# A URL that carries its version would ordinarily be answered `max-age` of a
# year and `immutable` — no revalidation at all — and `[assets]
# cache_control` is how an app says so. It is not set here, on purpose:
# **the header is one header for every file of the app, and not every
# request carries the version.** A browser asks for `/favicon.ico` itself,
# and anyone may open `/style.css`; a year of `immutable` on those paths is
# the same staleness this change is about, only with no way left to clear
# it. Saying it properly — long where the `?v=` names the version serving,
# `no-cache` where it does not — is the host's to decide per request, not
# this file's. Until then `no-cache` costs one conditional request that the
# `etag` answers `304` from memory, and the versioned URL has already taken
# away the failure it was guarding against.
