[workspace]
resolver = "2"
members = ["crates/minicloud"]

[workspace.package]
version = "0.25.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/myuon/minicloud"

# Cove, pinned to one commit. Every crate comes from the same revision; a
# change the host needs from the compiler or the runtime goes to myuon/cove
# first and is picked up here by moving `rev`.
[workspace.dependencies]
cove-diag = { git = "https://github.com/myuon/cove", rev = "2af2d11c5fe02ea3f8f4a057e24cb4f2cc297dc2" }
cove-ir = { git = "https://github.com/myuon/cove", rev = "2af2d11c5fe02ea3f8f4a057e24cb4f2cc297dc2" }
cove-runtime = { git = "https://github.com/myuon/cove", rev = "2af2d11c5fe02ea3f8f4a057e24cb4f2cc297dc2", features = ["template"] }
cove-sema = { git = "https://github.com/myuon/cove", rev = "2af2d11c5fe02ea3f8f4a057e24cb4f2cc297dc2" }
cove-syntax = { git = "https://github.com/myuon/cove", rev = "2af2d11c5fe02ea3f8f4a057e24cb4f2cc297dc2" }

# The profile the tests run under, for Cove's own reason: they run Cove
# programs (the CPU-heavy sample app counts primes for tens of milliseconds a
# request), and unoptimised that is several times slower. It inherits release
# and turns the checks back on, so nothing the debug build checks is lost.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
codegen-units = 16
incremental = true
