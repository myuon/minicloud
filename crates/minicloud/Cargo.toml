[package]
name = "minicloud"
description = "Hosts many small Cove web apps on one machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "minicloud"

[dependencies]
cove-diag.workspace = true
cove-ir.workspace = true
cove-runtime.workspace = true
cove-sema.workspace = true
cove-syntax.workspace = true

bytes = "1"
clap = { version = "4.5", features = ["derive"] }
form_urlencoded = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "deflate", "brotli"] }
# `hooks` is the authorizer and the progress handler, which is how an app's
# SQL is bounded ([`minicloud::sql`]); `limits` caps what one statement may be.
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
http-body-util = "0.1"
# `http2` is for the connections the host terminates TLS on itself
# ([`minicloud::tls`]); a plain connection is still HTTP/1.1.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
# Response compression: the bodies are already whole, so one pass over one
# buffer is the whole of it.
flate2 = "1"
# TLS the host terminates itself, so that a certificate and a key are all
# it needs to be reached directly.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
jsonwebtoken = "9"
# ACME, so the host can get its own certificate ([`minicloud::acme`]).
instant-acme = { version = "0.7", default-features = false, features = ["hyper-rustls", "ring"] }
# The key and the signing request an order is made with; also the TLS
# tests' certificate.
rcgen = "0.13"
# The WebSocket frames, for a connection a run holds both ways
# ([`minicloud::socket`]). No features: the host has already made the
# connection by the time this sees it.
tokio-tungstenite = { version = "0.24", default-features = false }
# The handshake's accept key, and nothing else.
base64 = "0.22"
# `split`, so the socket task may read and write at once.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
# The WebSocket tests' client.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
brotli = "8"
rand = "0.8"
rsa = "0.9"

# Peak resident memory, for the compression-bomb test.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
